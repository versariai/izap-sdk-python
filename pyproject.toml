[project]
name = "izap"
version = "0.3.0"
description = "Python SDK for the iZap API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "iZap", email = "support@izap.ai" }]
keywords = ["izap", "whatsapp", "api", "sdk", "webhooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://izap.ai"
Documentation = "https://devs.izap.ai"
Repository = "https://github.com/versariai/izap-sdk-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/izap"]

[tool.hatch.build.targets.sdist]
include = ["src/izap", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "openapi-python-client==0.29.1",
    "pytest==9.0.3",
    "ruff==0.15.14",
    "ty==0.0.39",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"
# Generated code is formatted by scripts/generate.py and gated by its drift check.
extend-exclude = ["src/izap/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
# Retry jitter, not cryptography.
ignore = ["S311"]

[tool.ty.src]
# Generated code is gated by the drift check; webhook_vectors.py runs in the backend's environment.
exclude = ["src/izap/_generated", "scripts/webhook_vectors.py"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"examples/**" = ["T201"]
